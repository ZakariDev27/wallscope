[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wallscope"
version = "1.0.0"
description = "WallScope platform layer: orchestration, risk scoring, policy checks, drift detection, reports and a local dashboard for the WallScope firewall detection engine."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ZaKari Perry" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wallscope-hub = "wallscope.cli:main"

[tool.setuptools.packages.find]
include = ["wallscope*"]

[tool.setuptools.package-data]
wallscope = ["web/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
